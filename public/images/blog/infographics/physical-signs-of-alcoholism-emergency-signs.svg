<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="etitle edesc" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <title id="etitle">Signs that need medical care right away</title>
  <desc id="edesc">Five signs that call for immediate medical attention whether or not alcohol is involved: yellowing of the skin or the whites of the eyes, known as jaundice; vomiting blood or material that looks like coffee grounds; black, tarry stools; new confusion or trouble thinking clearly; and a seizure. If a loved one is in immediate danger, call 911.</desc>
  <rect width="1200" height="460" fill="#FFFFFF"/>
  <text x="56" y="52" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="700" fill="#545555">Signs that need medical care right away</text>
  <text x="56" y="78" font-size="15" fill="#6B6C6C">Whether or not alcohol is involved — if in immediate danger, call 911</text>

  <g font-size="15">
    <g transform="translate(56,104)">
      <rect width="1088" height="56" rx="10" fill="#FBEEEE"/>
      <circle cx="30" cy="28" r="14" fill="#B3261E"/>
      <path d="M30 20v10M30 34h.01" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">Yellowing of the skin or the whites of the eyes (jaundice)</text>
    </g>
    <g transform="translate(56,168)">
      <rect width="1088" height="56" rx="10" fill="#FFFFFF"/>
      <circle cx="30" cy="28" r="14" fill="#B3261E"/>
      <path d="M30 20v10M30 34h.01" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">Vomiting blood or material that looks like coffee grounds</text>
    </g>
    <g transform="translate(56,232)">
      <rect width="1088" height="56" rx="10" fill="#FBEEEE"/>
      <circle cx="30" cy="28" r="14" fill="#B3261E"/>
      <path d="M30 20v10M30 34h.01" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">Black, tarry stools</text>
    </g>
    <g transform="translate(56,296)">
      <rect width="1088" height="56" rx="10" fill="#FFFFFF"/>
      <circle cx="30" cy="28" r="14" fill="#B3261E"/>
      <path d="M30 20v10M30 34h.01" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">New confusion or trouble thinking clearly</text>
    </g>
    <g transform="translate(56,360)">
      <rect width="1088" height="56" rx="10" fill="#FBEEEE"/>
      <circle cx="30" cy="28" r="14" fill="#B3261E"/>
      <path d="M30 20v10M30 34h.01" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">A seizure</text>
    </g>
  </g>

</svg>
