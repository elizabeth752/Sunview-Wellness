<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="ptitle pdesc" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <title id="ptitle">How long 7-OH stays in the blood</title>
  <desc id="pdesc">In human studies, 7-OH blood levels peaked about one to two hours after a dose, then declined with a half-life of roughly two to six hours, meaning the amount in the blood drops by half over that span, and that half-life got longer at higher doses.</desc>
  <rect width="1200" height="420" fill="#FFFFFF"/>
  <text x="56" y="52" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="700" fill="#545555">How long 7-OH stays in the blood</text>
  <text x="56" y="78" font-size="15" fill="#6B6C6C">Based on human studies of blood concentration after a single dose.</text>

  <!-- axis -->
  <line x1="110" y1="300" x2="1100" y2="300" stroke="#D9E6E6" stroke-width="2"/>
  <line x1="110" y1="120" x2="110" y2="300" stroke="#D9E6E6" stroke-width="2"/>
  <text x="70" y="160" text-anchor="middle" font-size="12" fill="#6B6C6C" transform="rotate(-90 70 160)">Blood level</text>

  <!-- rising/falling curve: dose at x=110, peak ~1-2h around x=260-320, decline toward x=1020 -->
  <path d="M110 296 C 160 230, 210 150, 290 140 C 400 128, 520 190, 650 236 C 780 272, 900 292, 1020 298"
        fill="none" stroke="#126E6E" stroke-width="5" stroke-linecap="round"/>

  <!-- peak window band -->
  <rect x="245" y="128" width="100" height="18" rx="9" fill="#CF9034"/>
  <text x="295" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#545555">Peak: ~1-2 hours</text>
  <line x1="295" y1="128" x2="295" y2="146" stroke="#CF9034" stroke-width="2"/>

  <!-- half-life bracket -->
  <g>
    <line x1="290" y1="340" x2="650" y2="340" stroke="#1F9E9E" stroke-width="3"/>
    <line x1="290" y1="332" x2="290" y2="348" stroke="#1F9E9E" stroke-width="3"/>
    <line x1="650" y1="332" x2="650" y2="348" stroke="#1F9E9E" stroke-width="3"/>
    <text x="470" y="366" text-anchor="middle" font-size="13" font-weight="800" fill="#126E6E">Half-life: roughly 2-6 hours</text>
  </g>

  <!-- dose marker -->
  <circle cx="110" cy="298" r="7" fill="#545555"/>
  <text x="110" y="326" text-anchor="middle" font-size="12" fill="#6B6C6C">Dose taken</text>

  <!-- x axis ticks -->
  <g font-size="12" fill="#6B6C6C">
    <text x="1020" y="326" text-anchor="middle">Hours later</text>
  </g>

  <text x="56" y="396" font-size="14" font-weight="700" fill="#3E4444">The half-life got longer at higher doses in the same studies.</text>
</svg>
