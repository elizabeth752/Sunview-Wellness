<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="mtitle mdesc" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <title id="mtitle">What testing finds in products sold as molly</title>
  <desc id="mdesc">A drug-checking service analyzed 4,719 samples sold as MDMA between 1999 and 2023. 199 distinct adulterants were identified. Six commonly found substances: synthetic cathinones (bath salts, amphetamine-like stimulants with cardiac and psychiatric risk); MDA and MDEA (chemical cousins of MDMA with longer duration); methamphetamine and amphetamine (stimulants that raise heart rate and temperature); ketamine (a dissociative anesthetic causing sedation instead of stimulation); caffeine, ephedrine and dextromethorphan (cutting agents that disguise low MDMA content); and inert fillers such as detergent and talcum powder, which make dose impossible to estimate.</desc>
  <rect width="1200" height="760" fill="#FFFFFF"/>

  <!-- Header stat band -->
  <rect x="0" y="0" width="1200" height="164" fill="#126E6E"/>
  <circle cx="1146" cy="-10" r="120" fill="none" stroke="#CF9034" stroke-width="2" opacity="0.35"/>
  <circle cx="1146" cy="-10" r="160" fill="none" stroke="#CF9034" stroke-width="2" opacity="0.22"/>
  <text x="56" y="66" font-size="15" font-weight="800" letter-spacing="1.6" fill="#F5C518">WHAT TESTING FINDS IN PRODUCTS SOLD AS MOLLY</text>
  <text x="56" y="126" font-family="Georgia, 'Playfair Display', serif" font-size="44" font-weight="700" fill="#FFFFFF">199 adulterants identified in 25 years</text>
  <text x="56" y="152" font-size="16" fill="#EAF6F6">Drug-checking analysis of 4,719 samples sold as MDMA, 1999–2023</text>

  <!-- Card grid: 2 columns x 3 rows -->
  <!-- Card template metrics: x width 552, height 150, gap 40 -->
  <g font-size="14">
    <!-- Row 1 -->
    <g transform="translate(48,196)">
      <rect width="552" height="150" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="46" cy="46" r="22" fill="#126E6E"/>
      <path d="M38 46 h16 M46 38 v16" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="38" font-weight="800" fill="#545555" font-size="17">Synthetic cathinones</text>
      <text x="82" y="60" fill="#126E6E" font-weight="700" font-size="13">"Bath salts" — amphetamine-like stimulants</text>
      <text x="24" y="104" fill="#3E4444" font-size="14">
        <tspan x="24" dy="0">Effects can last longer than MDMA and</tspan>
        <tspan x="24" dy="20">carry significant cardiac and psychiatric risk.</tspan>
      </text>
    </g>
    <g transform="translate(624,196)">
      <rect width="552" height="150" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="46" cy="46" r="22" fill="#126E6E"/>
      <path d="M36 40 l20 12 -20 12 z" fill="#FFFFFF"/>
      <text x="82" y="38" font-weight="800" fill="#545555" font-size="17">MDA and MDEA</text>
      <text x="82" y="60" fill="#126E6E" font-weight="700" font-size="13">Chemical cousins of MDMA</text>
      <text x="24" y="104" fill="#3E4444" font-size="14">
        <tspan x="24" dy="0">Longer duration and a different effect</tspan>
        <tspan x="24" dy="20">profile than the buyer expects.</tspan>
      </text>
    </g>
    <!-- Row 2 -->
    <g transform="translate(48,362)">
      <rect width="552" height="150" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="46" cy="46" r="22" fill="#126E6E"/>
      <path d="M46 30 v22 l14 14" stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="82" y="38" font-weight="800" fill="#545555" font-size="17">Methamphetamine &amp; amphetamine</text>
      <text x="82" y="60" fill="#126E6E" font-weight="700" font-size="13">Potent stimulants</text>
      <text x="24" y="104" fill="#3E4444" font-size="14">
        <tspan x="24" dy="0">Raise heart rate and body temperature</tspan>
        <tspan x="24" dy="20">without MDMA's expected effects.</tspan>
      </text>
    </g>
    <g transform="translate(624,362)">
      <rect width="552" height="150" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="46" cy="46" r="22" fill="#126E6E"/>
      <ellipse cx="46" cy="46" rx="14" ry="9" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <text x="82" y="38" font-weight="800" fill="#545555" font-size="17">Ketamine</text>
      <text x="82" y="60" fill="#126E6E" font-weight="700" font-size="13">A dissociative anesthetic</text>
      <text x="24" y="104" fill="#3E4444" font-size="14">
        <tspan x="24" dy="0">Produces sedation and detachment</tspan>
        <tspan x="24" dy="20">rather than stimulation.</tspan>
      </text>
    </g>
    <!-- Row 3 -->
    <g transform="translate(48,528)">
      <rect width="552" height="150" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="46" cy="46" r="22" fill="#126E6E"/>
      <path d="M38 52 q8 -20 16 0 q8 -20 16 0" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <text x="82" y="38" font-weight="800" fill="#545555" font-size="17">Caffeine, ephedrine, dextromethorphan</text>
      <text x="82" y="60" fill="#126E6E" font-weight="700" font-size="13">Common cutting agents</text>
      <text x="24" y="104" fill="#3E4444" font-size="14">
        <tspan x="24" dy="0">Add stimulant or dissociative load and</tspan>
        <tspan x="24" dy="20">disguise how little MDMA is present.</tspan>
      </text>
    </g>
    <g transform="translate(624,528)">
      <rect width="552" height="150" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="46" cy="46" r="22" fill="#126E6E"/>
      <rect x="36" y="36" width="20" height="20" rx="3" fill="none" stroke="#FFFFFF" stroke-width="3"/>
      <text x="82" y="38" font-weight="800" fill="#545555" font-size="17">Inert fillers</text>
      <text x="82" y="60" fill="#126E6E" font-weight="700" font-size="13">Detergent, talcum powder and similar</text>
      <text x="24" y="104" fill="#3E4444" font-size="14">
        <tspan x="24" dy="0">Non-psychoactive powder that makes</tspan>
        <tspan x="24" dy="20">dose impossible to estimate by sight.</tspan>
      </text>
    </g>
  </g>

  <text x="56" y="712" font-size="13" fill="#6B6C6C">Source: Sevigny et al., 2024, </text>
  <text x="222" y="712" font-size="13" font-style="italic" fill="#6B6C6C">Drug and Alcohol Dependence</text>
  <!-- bottom wave -->
  <path d="M0 748c160-14 320-14 480-4s320 12 480 0 160-12 240-8" stroke="#CF9034" stroke-width="2" opacity="0.5" fill="none"/>
</svg>
