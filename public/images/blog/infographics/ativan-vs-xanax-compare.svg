<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="axtitle axdesc" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <title id="axtitle">Ativan vs. Xanax</title>
  <desc id="axdesc">Left column, Ativan (lorazepam): FDA-approved for anxiety disorders and short-term relief of anxiety symptoms, peaks in the blood about 2 hours after a dose, average half-life about 12 hours, and is processed through glucuronidation. Right column, Xanax (alprazolam): FDA-approved for generalized anxiety disorder and panic disorder, peaks about 1 to 2 hours after a dose, and has an average half-life of about 11 hours. Both carry FDA boxed warnings for misuse, addiction, and physical dependence.</desc>
  <rect width="1200" height="480" fill="#F0FAFA"/>
  <text x="56" y="52" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="700" fill="#545555">Ativan vs. Xanax</text>
  <text x="56" y="78" font-size="15" fill="#6B6C6C">Both are benzodiazepines that act on the same GABA-A receptor</text>

  <!-- left column: Ativan -->
  <g transform="translate(80,110)">
    <rect width="470" height="330" rx="18" fill="#FFFFFF" stroke="#D9E6E6"/>
    <text x="28" y="40" font-size="13" font-weight="800" fill="#8A8B8B" letter-spacing="0.08em">ATIVAN (LORAZEPAM)</text>
    <g font-size="15" fill="#3E4444">
      <circle cx="34" cy="78" r="4" fill="#CF9034"/>
      <text x="50" y="83" font-weight="800">FDA-approved uses</text>
      <text x="50" y="104" font-size="13" fill="#6B6C6C">Anxiety disorders, short-term relief of symptoms</text>

      <circle cx="34" cy="138" r="4" fill="#CF9034"/>
      <text x="50" y="143" font-weight="800">Peak blood concentration</text>
      <text x="50" y="164" font-size="13" fill="#6B6C6C">About 2 hours after a dose</text>

      <circle cx="34" cy="198" r="4" fill="#CF9034"/>
      <text x="50" y="203" font-weight="800">Average half-life</text>
      <text x="50" y="224" font-size="13" fill="#6B6C6C">About 12 hours</text>

      <circle cx="34" cy="258" r="4" fill="#CF9034"/>
      <text x="50" y="263" font-weight="800">How the body clears it</text>
      <text x="50" y="284" font-size="13" fill="#6B6C6C">Glucuronidation, not the usual liver-enzyme pathway</text>
    </g>
  </g>

  <!-- right column: Xanax -->
  <g transform="translate(650,110)">
    <rect width="470" height="330" rx="18" fill="#126E6E"/>
    <text x="28" y="40" font-size="13" font-weight="800" fill="#B9DEDE" letter-spacing="0.08em">XANAX (ALPRAZOLAM)</text>
    <g font-size="15" fill="#FFFFFF">
      <circle cx="34" cy="78" r="4" fill="#F5C518"/>
      <text x="50" y="83" font-weight="800">FDA-approved uses</text>
      <text x="50" y="104" font-size="13" fill="#DCEFEF">Generalized anxiety disorder, panic disorder</text>

      <circle cx="34" cy="138" r="4" fill="#F5C518"/>
      <text x="50" y="143" font-weight="800">Peak blood concentration</text>
      <text x="50" y="164" font-size="13" fill="#DCEFEF">About 1 to 2 hours after a dose</text>

      <circle cx="34" cy="198" r="4" fill="#F5C518"/>
      <text x="50" y="203" font-weight="800">Average half-life</text>
      <text x="50" y="224" font-size="13" fill="#DCEFEF">About 11 hours</text>

      <circle cx="34" cy="258" r="4" fill="#F5C518"/>
      <text x="50" y="263" font-weight="800">How the body clears it</text>
      <text x="50" y="284" font-size="13" fill="#DCEFEF">Standard liver-enzyme pathway</text>
    </g>
  </g>

  <text x="56" y="450" font-size="14" font-weight="700" fill="#3E4444">Both carry FDA boxed warnings for misuse, addiction, and physical dependence.</text>
</svg>
