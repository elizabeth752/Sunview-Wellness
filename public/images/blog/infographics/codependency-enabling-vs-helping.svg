<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="ehtitle ehdesc" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <title id="ehtitle">Enabling vs. helping</title>
  <desc id="ehdesc">Left column, enabling: making excuses for a loved one, taking over their responsibilities, arguing while they are using, and leading with blame. Right column, helping: letting them answer for themselves, handing responsibilities back, talking when they are sober, and leading with concern and hope.</desc>
  <rect width="1200" height="480" fill="#F0FAFA"/>
  <text x="56" y="52" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="700" fill="#545555">Enabling vs. helping</text>
  <text x="56" y="78" font-size="15" fill="#6B6C6C">CRAFT (Community Reinforcement and Family Training) draws this line for families</text>

  <!-- left column: enabling -->
  <g transform="translate(80,110)">
    <rect width="470" height="330" rx="18" fill="#FFFFFF" stroke="#D9E6E6"/>
    <text x="28" y="40" font-size="13" font-weight="800" fill="#8A8B8B" letter-spacing="0.08em">ENABLING</text>
    <g font-size="15" fill="#3E4444">
      <circle cx="34" cy="78" r="4" fill="#CF9034"/>
      <text x="50" y="83" font-weight="800">Making excuses</text>
      <text x="50" y="104" font-size="13" fill="#6B6C6C">Lying or covering for a loved one's drinking</text>

      <circle cx="34" cy="138" r="4" fill="#CF9034"/>
      <text x="50" y="143" font-weight="800">Taking over</text>
      <text x="50" y="164" font-size="13" fill="#6B6C6C">Handling their obligations so they avoid consequences</text>

      <circle cx="34" cy="198" r="4" fill="#CF9034"/>
      <text x="50" y="203" font-weight="800">Arguing during use</text>
      <text x="50" y="224" font-size="13" fill="#6B6C6C">Confronting them while they are impaired</text>

      <circle cx="34" cy="258" r="4" fill="#CF9034"/>
      <text x="50" y="263" font-weight="800">Blame</text>
      <text x="50" y="284" font-size="13" fill="#6B6C6C">Framing concern as an accusation</text>
    </g>
  </g>

  <!-- right column: helping -->
  <g transform="translate(650,110)">
    <rect width="470" height="330" rx="18" fill="#126E6E"/>
    <text x="28" y="40" font-size="13" font-weight="800" fill="#B9DEDE" letter-spacing="0.08em">HELPING</text>
    <g font-size="15" fill="#FFFFFF">
      <circle cx="34" cy="78" r="4" fill="#F5C518"/>
      <text x="50" y="83" font-weight="800">Letting them answer for themselves</text>
      <text x="50" y="104" font-size="13" fill="#DCEFEF">No excuses made on their behalf</text>

      <circle cx="34" cy="138" r="4" fill="#F5C518"/>
      <text x="50" y="143" font-weight="800">Handing responsibilities back</text>
      <text x="50" y="164" font-size="13" fill="#DCEFEF">Letting natural consequences happen</text>

      <circle cx="34" cy="198" r="4" fill="#F5C518"/>
      <text x="50" y="203" font-weight="800">Talking when they're sober</text>
      <text x="50" y="224" font-size="13" fill="#DCEFEF">Waiting until they can actually hear you</text>

      <circle cx="34" cy="258" r="4" fill="#F5C518"/>
      <text x="50" y="263" font-weight="800">Concern and hope</text>
      <text x="50" y="284" font-size="13" fill="#DCEFEF">Naming what's changed for the better</text>
    </g>
  </g>

  <text x="56" y="450" font-size="14" font-weight="700" fill="#3E4444">Enabling protects the substance use. Helping supports the person without supporting the use.</text>
</svg>
