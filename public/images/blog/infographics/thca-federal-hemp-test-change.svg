<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="ltitle ldesc" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <title id="ltitle">How the federal hemp test is changing</title>
  <desc id="ldesc">Today, federal law tests hemp only for delta-9 THC, capped at 0.3% on a dry weight basis, which is why flower high in THCA but low in delta-9 THC can be sold as hemp. Starting December 11, 2026, under Public Law 119-37, the test counts total THC, meaning THCA and delta-9 THC combined, still capped at 0.3%. Most THCA flower will no longer meet that limit once the change takes effect.</desc>
  <rect width="1200" height="420" fill="#FFFFFF"/>
  <text x="56" y="52" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="700" fill="#545555">How the federal hemp test is changing</text>
  <text x="56" y="78" font-size="15" fill="#6B6C6C">Same 0.3% limit. What gets counted toward it is changing.</text>

  <!-- axis -->
  <line x1="100" y1="230" x2="1100" y2="230" stroke="#D9E6E6" stroke-width="2"/>

  <!-- teal band: now -->
  <rect x="100" y="150" width="430" height="90" rx="12" fill="#126E6E"/>
  <text x="315" y="186" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">Today</text>
  <text x="315" y="208" text-anchor="middle" fill="#EAF6F6" font-size="13">Test counts delta-9 THC only</text>
  <text x="315" y="226" text-anchor="middle" fill="#EAF6F6" font-size="13">THCA flower can pass at 0.3%</text>

  <!-- gold band: after change -->
  <rect x="570" y="150" width="530" height="90" rx="12" fill="#CF9034"/>
  <text x="835" y="186" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">Starting Dec. 11, 2026</text>
  <text x="835" y="208" text-anchor="middle" fill="#FCEEDA" font-size="13">Test counts total THC</text>
  <text x="835" y="226" text-anchor="middle" fill="#FCEEDA" font-size="13">(THCA + delta-9 THC combined)</text>

  <!-- marker at the effective date -->
  <line x1="570" y1="120" x2="570" y2="270" stroke="#545555" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="570" y="110" text-anchor="middle" font-size="13" font-weight="800" fill="#545555">Public Law 119-37 takes effect</text>

  <!-- ticks -->
  <g font-size="13" fill="#6B6C6C">
    <line x1="100" y1="270" x2="100" y2="280" stroke="#B7C4C4"/>
    <text x="100" y="300" text-anchor="middle">Now</text>
    <line x1="570" y1="270" x2="570" y2="280" stroke="#B7C4C4"/>
    <text x="570" y="300" text-anchor="middle" font-weight="800" fill="#3E4444">Dec 11, 2026</text>
    <line x1="1100" y1="270" x2="1100" y2="280" stroke="#B7C4C4"/>
    <text x="1100" y="300" text-anchor="middle">After</text>
  </g>

  <text x="56" y="380" font-size="14" font-weight="700" fill="#3E4444">Once THCA is counted, most high-THCA flower will no longer meet the federal definition of hemp.</text>
</svg>
