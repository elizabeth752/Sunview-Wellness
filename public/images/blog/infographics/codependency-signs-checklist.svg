<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="cotitle codesc" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <title id="cotitle">Signs of a codependent relationship</title>
  <desc id="codesc">Six signs family members may show without realizing it: covering for them by making excuses for missed work or events; taking over their responsibilities, such as paying their bills; organizing your days around their use, including waiting up for them; keeping quiet to avoid conflict; feeling responsible for their choices and guilty when you say no; and putting your own health last.</desc>
  <rect width="1200" height="520" fill="#FFFFFF"/>
  <text x="56" y="52" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="700" fill="#545555">Signs of a codependent relationship</text>
  <text x="56" y="78" font-size="15" fill="#6B6C6C">Patterns that can build up without feeling like a pattern at all</text>

  <g font-size="15">
    <g transform="translate(56,104)">
      <rect width="1088" height="56" rx="10" fill="#F0FAFA"/>
      <circle cx="30" cy="28" r="14" fill="#126E6E"/>
      <path d="M22 28l5 6 10-13" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">Covering for them with employers, relatives, or friends</text>
    </g>
    <g transform="translate(56,166)">
      <rect width="1088" height="56" rx="10" fill="#FFFFFF"/>
      <circle cx="30" cy="28" r="14" fill="#126E6E"/>
      <path d="M22 28l5 6 10-13" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">Taking over their responsibilities, like paying their bills</text>
    </g>
    <g transform="translate(56,228)">
      <rect width="1088" height="56" rx="10" fill="#F0FAFA"/>
      <circle cx="30" cy="28" r="14" fill="#126E6E"/>
      <path d="M22 28l5 6 10-13" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">Organizing your days around their use</text>
    </g>
    <g transform="translate(56,290)">
      <rect width="1088" height="56" rx="10" fill="#FFFFFF"/>
      <circle cx="30" cy="28" r="14" fill="#126E6E"/>
      <path d="M22 28l5 6 10-13" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">Keeping quiet to avoid an argument</text>
    </g>
    <g transform="translate(56,352)">
      <rect width="1088" height="56" rx="10" fill="#F0FAFA"/>
      <circle cx="30" cy="28" r="14" fill="#126E6E"/>
      <path d="M22 28l5 6 10-13" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">Feeling responsible for their choices</text>
    </g>
    <g transform="translate(56,414)">
      <rect width="1088" height="56" rx="10" fill="#FFFFFF"/>
      <circle cx="30" cy="28" r="14" fill="#126E6E"/>
      <path d="M22 28l5 6 10-13" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="34" font-weight="700" fill="#3E4444">Putting your own health and friendships last</text>
    </g>
  </g>

  <text x="56" y="492" font-size="13" fill="#6B6C6C" font-style="italic">Not a diagnosis — a relationship pattern worth naming (MHA, 2026; SAMHSA, 2020a)</text>
</svg>
