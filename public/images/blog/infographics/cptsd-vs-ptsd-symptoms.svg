<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="ctitle cdesc" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <title id="ctitle">Shared symptoms, and what sets CPTSD apart</title>
  <desc id="cdesc">Left column: symptoms of both PTSD and CPTSD — reliving the event, avoidance, anxiety, and negative thoughts and feelings. Right column: four additional symptoms that set CPTSD apart — difficulty managing emotions, negative self-perception, relationship difficulties, and disconnection or dissociation.</desc>
  <rect width="1200" height="480" fill="#F0FAFA"/>
  <text x="56" y="52" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="700" fill="#545555">Shared symptoms, and what sets CPTSD apart</text>
  <text x="56" y="78" font-size="15" fill="#6B6C6C">Only a mental health professional can confirm either diagnosis</text>

  <!-- left column: shared with PTSD -->
  <g transform="translate(80,110)">
    <rect width="470" height="330" rx="18" fill="#FFFFFF" stroke="#D9E6E6"/>
    <text x="28" y="40" font-size="13" font-weight="800" fill="#8A8B8B" letter-spacing="0.08em">SYMPTOMS OF BOTH PTSD AND CPTSD</text>
    <g font-size="15" fill="#3E4444">
      <circle cx="34" cy="78" r="4" fill="#CF9034"/>
      <text x="50" y="83" font-weight="800">Reliving the event</text>
      <text x="50" y="104" font-size="13" fill="#6B6C6C">Flashbacks, distressing memories, or nightmares</text>

      <circle cx="34" cy="138" r="4" fill="#CF9034"/>
      <text x="50" y="143" font-weight="800">Avoidance</text>
      <text x="50" y="164" font-size="13" fill="#6B6C6C">Steering clear of people, places, or reminders</text>

      <circle cx="34" cy="198" r="4" fill="#CF9034"/>
      <text x="50" y="203" font-weight="800">Anxiety</text>
      <text x="50" y="224" font-size="13" fill="#6B6C6C">On edge, easily startled, trouble concentrating</text>

      <circle cx="34" cy="258" r="4" fill="#CF9034"/>
      <text x="50" y="263" font-weight="800">Negative thoughts and feelings</text>
      <text x="50" y="284" font-size="13" fill="#6B6C6C">Self-blame, persistent fear, guilt, or shame</text>
    </g>
  </g>

  <!-- right column: sets CPTSD apart -->
  <g transform="translate(650,110)">
    <rect width="470" height="330" rx="18" fill="#126E6E"/>
    <text x="28" y="40" font-size="13" font-weight="800" fill="#B9DEDE" letter-spacing="0.08em">SYMPTOMS THAT SET CPTSD APART</text>
    <g font-size="15" fill="#FFFFFF">
      <circle cx="34" cy="78" r="4" fill="#F5C518"/>
      <text x="50" y="83" font-weight="800">Difficulty managing emotions</text>
      <text x="50" y="104" font-size="13" fill="#DCEFEF">Feeling overwhelmed or unable to regulate</text>

      <circle cx="34" cy="138" r="4" fill="#F5C518"/>
      <text x="50" y="143" font-weight="800">Negative self-perception</text>
      <text x="50" y="164" font-size="13" fill="#DCEFEF">Persistent worthlessness, shame, or failure</text>

      <circle cx="34" cy="198" r="4" fill="#F5C518"/>
      <text x="50" y="203" font-weight="800">Relationship difficulties</text>
      <text x="50" y="224" font-size="13" fill="#DCEFEF">Struggling to trust, withdrawing, feeling distant</text>

      <circle cx="34" cy="258" r="4" fill="#F5C518"/>
      <text x="50" y="263" font-weight="800">Disconnection or dissociation</text>
      <text x="50" y="284" font-size="13" fill="#DCEFEF">Feeling detached from yourself or surroundings</text>
    </g>
  </g>

  <text x="56" y="450" font-size="14" font-weight="700" fill="#3E4444">CPTSD includes every PTSD symptom, plus these four additional patterns.</text>
</svg>
