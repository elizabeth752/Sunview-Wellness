<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="btitle bdesc" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <title id="btitle">What regular heavy drinking can do to the body</title>
  <desc id="bdesc">Five effects of regular heavy alcohol use: brain and mood, where alcohol interferes with the brain's communication pathways and can change mood and behavior; heart, where alcohol misuse can raise blood pressure and long-term heavy drinking can weaken the heart muscle; liver, where heavy drinking can cause inflammation, scarring, and cirrhosis; immune system, where heavy drinking can weaken the body's ability to fight infections; and cancer risk, where alcohol is linked to several cancers and even one daily drink can raise a woman's breast cancer risk by 5 to 15 percent.</desc>
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <text x="56" y="52" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="700" fill="#545555">What daily drinking does to the body</text>
  <text x="56" y="78" font-size="15" fill="#6B6C6C">Alcohol affects nearly every part of the body over time</text>

  <!-- row 1: 3 cards, 368 wide, gap 32, start x=48 -->
  <g>
    <g transform="translate(48,108)">
      <rect width="368" height="176" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="48" cy="48" r="22" fill="#126E6E"/>
      <path d="M38 40c2-6 8-9 14-6 5 3 6 9 2 13-3 3-2 7 1 9-5 3-11 1-13-3-4 1-7-3-6-7-3-1-4-4-2-6z" fill="#F5C518"/>
      <text x="84" y="54" font-weight="800" fill="#545555" font-size="17">Brain &amp; mood</text>
      <text x="24" y="92" fill="#3E4444" font-size="13.5">
        <tspan x="24" dy="0">Interferes with the brain's</tspan>
        <tspan x="24" dy="19">communication pathways,</tspan>
        <tspan x="24" dy="19">which can change mood</tspan>
        <tspan x="24" dy="19">and behavior.</tspan>
      </text>
    </g>
    <g transform="translate(448,108)">
      <rect width="368" height="176" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="48" cy="48" r="22" fill="#126E6E"/>
      <path d="M48 60c-10-8-18-14-18-23a9 9 0 0 1 18-3 9 9 0 0 1 18 3c0 9-8 15-18 23z" fill="#F5C518"/>
      <text x="84" y="54" font-weight="800" fill="#545555" font-size="17">Heart</text>
      <text x="24" y="92" fill="#3E4444" font-size="13.5">
        <tspan x="24" dy="0">Misuse can raise blood</tspan>
        <tspan x="24" dy="19">pressure, and long-term</tspan>
        <tspan x="24" dy="19">heavy drinking can weaken</tspan>
        <tspan x="24" dy="19">the heart muscle.</tspan>
      </text>
    </g>
    <g transform="translate(848,108)">
      <rect width="304" height="176" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="48" cy="48" r="22" fill="#126E6E"/>
      <path d="M48 32c8 10 13 18 13 26a13 13 0 1 1-26 0c0-8 5-16 13-26z" fill="#F5C518"/>
      <text x="84" y="54" font-weight="800" fill="#545555" font-size="17">Liver</text>
      <text x="24" y="92" fill="#3E4444" font-size="13.5">
        <tspan x="24" dy="0">Inflammation, scarring,</tspan>
        <tspan x="24" dy="19">and cirrhosis — late-stage</tspan>
        <tspan x="24" dy="19">liver disease.</tspan>
      </text>
    </g>
  </g>

  <!-- row 2: 2 cards, 368 wide, gap 32, centered: total 768, left margin (1200-768)/2=216 -->
  <g>
    <g transform="translate(216,316)">
      <rect width="368" height="176" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="48" cy="48" r="22" fill="#126E6E"/>
      <path d="M48 30l16 7v12c0 12-7 20-16 24-9-4-16-12-16-24V37z" fill="none" stroke="#F5C518" stroke-width="2.6"/>
      <text x="84" y="54" font-weight="800" fill="#545555" font-size="17">Immune system</text>
      <text x="24" y="92" fill="#3E4444" font-size="13.5">
        <tspan x="24" dy="0">Heavy drinking can weaken</tspan>
        <tspan x="24" dy="19">the body's ability to</tspan>
        <tspan x="24" dy="19">fight infections.</tspan>
      </text>
    </g>
    <g transform="translate(616,316)">
      <rect width="368" height="176" rx="14" fill="#F0FAFA" stroke="#D9E6E6"/>
      <circle cx="48" cy="48" r="22" fill="#126E6E"/>
      <circle cx="48" cy="48" r="13" fill="none" stroke="#F5C518" stroke-width="2.6"/>
      <circle cx="48" cy="48" r="5" fill="#F5C518"/>
      <text x="84" y="54" font-weight="800" fill="#545555" font-size="17">Cancer risk</text>
      <text x="24" y="92" fill="#3E4444" font-size="13.5">
        <tspan x="24" dy="0">Linked to several cancers —</tspan>
        <tspan x="24" dy="19">one daily drink can raise a</tspan>
        <tspan x="24" dy="19">woman's breast cancer risk</tspan>
        <tspan x="24" dy="19">by 5% to 15%.</tspan>
      </text>
    </g>
  </g>
</svg>
