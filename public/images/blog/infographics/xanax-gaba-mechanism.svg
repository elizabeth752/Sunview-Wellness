<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="gtitle gdesc" font-family="Nunito, 'Segoe UI', Arial, sans-serif">
  <title id="gtitle">How alprazolam acts on the GABA-A receptor</title>
  <desc id="gdesc">Alprazolam attaches to the GABA-A receptor and makes GABA, the brain's slow-down chemical, more effective. The receptor is built from several parts. The alpha-1 part is responsible for sedation, memory loss and unsteadiness. The alpha-2 and alpha-3 parts are responsible for easing anxiety and relaxing muscles. Alprazolam does not pick and choose between these parts — it acts on all of them at once, which is why the calming effect and the fogginess, sedation or unsteadiness show up together.</desc>
  <rect width="1200" height="460" fill="#F0FAFA"/>
  <text x="56" y="52" font-family="Georgia, 'Playfair Display', serif" font-size="28" font-weight="700" fill="#545555">One receptor, two effects at once</text>
  <text x="56" y="78" font-size="15" fill="#6B6C6C">Alprazolam doesn't pick and choose between GABA-A receptor parts — it acts on all of them together</text>

  <!-- central receptor node -->
  <circle cx="360" cy="250" r="72" fill="#126E6E"/>
  <text x="360" y="240" text-anchor="middle" fill="#FFFFFF" font-weight="800" font-size="16">GABA-A</text>
  <text x="360" y="262" text-anchor="middle" fill="#EAF6F6" font-size="13">receptor</text>
  <text x="360" y="164" text-anchor="middle" fill="#545555" font-size="14" font-weight="700">Alprazolam binds here</text>
  <path d="M360 178 v0" stroke="#CF9034" stroke-width="3"/>
  <circle cx="360" cy="250" r="90" fill="none" stroke="#CF9034" stroke-width="2" stroke-dasharray="3 7"/>

  <!-- branch to alpha-1 (top) -->
  <path d="M420 210 C 560 150, 640 130, 740 118" stroke="#126E6E" stroke-width="3" fill="none"/>
  <g transform="translate(760,70)">
    <rect x="0" y="0" width="400" height="128" rx="14" fill="#FFFFFF" stroke="#D9E6E6"/>
    <rect x="0" y="0" width="6" height="128" rx="3" fill="#126E6E"/>
    <text x="24" y="32" font-weight="800" fill="#545555" font-size="17">Alpha-1 subunit</text>
    <text x="24" y="58" fill="#3E4444" font-size="14">
      <tspan x="24" dy="0">Sedation, memory loss and</tspan>
      <tspan x="24" dy="20">unsteadiness — the effects that</tspan>
      <tspan x="24" dy="20">feel like impairment.</tspan>
    </text>
  </g>

  <!-- branch to alpha-2/3 (bottom) -->
  <path d="M420 290 C 560 350, 640 370, 740 382" stroke="#126E6E" stroke-width="3" fill="none"/>
  <g transform="translate(760,318)">
    <rect x="0" y="0" width="400" height="128" rx="14" fill="#FFFFFF" stroke="#D9E6E6"/>
    <rect x="0" y="0" width="6" height="128" rx="3" fill="#CF9034"/>
    <text x="24" y="32" font-weight="800" fill="#545555" font-size="17">Alpha-2 &amp; alpha-3 subunits</text>
    <text x="24" y="58" fill="#3E4444" font-size="14">
      <tspan x="24" dy="0">Easing anxiety and relaxing</tspan>
      <tspan x="24" dy="20">muscles — the effects the</tspan>
      <tspan x="24" dy="20">prescription is meant to treat.</tspan>
    </text>
  </g>

  <text x="56" y="430" font-size="14" font-weight="700" fill="#3E4444">Both pathways activate together — the calming effect and the fogginess arrive as a package deal.</text>
</svg>
